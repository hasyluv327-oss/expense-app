<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExpenseFlow — 経費精算システム</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="8" fill="#4F46E5"/>
          <path d="M7 14h14M14 7v14" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <span>ExpenseFlow</span>
      </div>
      <nav>
        <button class="nav-item active" data-view="dashboard">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          ダッシュボード
        </button>
        <button class="nav-item" data-view="submit">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
          経費申請
        </button>
        <button class="nav-item" data-view="approval">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          承認管理
          <span class="badge" id="pendingBadge">0</span>
        </button>
        <button class="nav-item" data-view="history">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          申請履歴
        </button>
      </nav>
      <div class="sidebar-footer">
        <div class="user-avatar">田</div>
        <div class="user-info">
          <div class="user-name">田中 太郎</div>
          <div class="user-role">一般社員</div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <!-- Dashboard View -->
      <div id="view-dashboard" class="view active">
        <div class="page-header">
          <h1>ダッシュボード</h1>
          <div class="month-selector">
            <button id="prevMonth">‹</button>
            <span id="currentMonthLabel"></span>
            <button id="nextMonth">›</button>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">今月の申請合計</div>
            <div class="stat-value" id="statTotal">¥0</div>
            <div class="stat-sub" id="statCount">0件</div>
          </div>
          <div class="stat-card approved">
            <div class="stat-label">承認済み</div>
            <div class="stat-value" id="statApproved">¥0</div>
            <div class="stat-sub" id="statApprovedCount">0件</div>
          </div>
          <div class="stat-card pending">
            <div class="stat-label">承認待ち</div>
            <div class="stat-value" id="statPending">¥0</div>
            <div class="stat-sub" id="statPendingCount">0件</div>
          </div>
          <div class="stat-card rejected">
            <div class="stat-label">差し戻し</div>
            <div class="stat-value" id="statRejected">¥0</div>
            <div class="stat-sub" id="statRejectedCount">0件</div>
          </div>
        </div>

        <div class="charts-grid">
          <div class="card chart-card">
            <h3>カテゴリ別内訳</h3>
            <canvas id="categoryChart"></canvas>
          </div>
          <div class="card chart-card">
            <h3>月次推移（6ヶ月）</h3>
            <canvas id="trendChart"></canvas>
          </div>
        </div>

        <div class="card">
          <h3>最近の申請</h3>
          <table class="expense-table" id="recentTable">
            <thead>
              <tr>
                <th>日付</th>
                <th>内容</th>
                <th>カテゴリ</th>
                <th>金額</th>
                <th>ステータス</th>
              </tr>
            </thead>
            <tbody id="recentTableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- Submit View -->
      <div id="view-submit" class="view">
        <div class="page-header">
          <h1>経費申請</h1>
        </div>
        <div class="card form-card">
          <form id="expenseForm">
            <div class="form-grid">
              <div class="form-group">
                <label for="expDate">日付 <span class="required">*</span></label>
                <input type="date" id="expDate" required />
              </div>
              <div class="form-group">
                <label for="expCategory">カテゴリ <span class="required">*</span></label>
                <select id="expCategory" required>
                  <option value="">選択してください</option>
                  <option value="交通費">交通費</option>
                  <option value="宿泊費">宿泊費</option>
                  <option value="会議費">会議費</option>
                  <option value="接待費">接待費</option>
                  <option value="消耗品費">消耗品費</option>
                  <option value="通信費">通信費</option>
                  <option value="その他">その他</option>
                </select>
              </div>
              <div class="form-group">
                <label for="expAmount">金額（円） <span class="required">*</span></label>
                <input type="number" id="expAmount" placeholder="例: 3500" min="1" required />
              </div>
              <div class="form-group">
                <label for="expPayee">支払先</label>
                <input type="text" id="expPayee" placeholder="例: JR東日本、〇〇レストラン" />
              </div>
              <div class="form-group full-width">
                <label for="expMemo">メモ・用途 <span class="required">*</span></label>
                <textarea id="expMemo" rows="3" placeholder="用途・目的を入力してください" required></textarea>
              </div>
              <div class="form-group full-width">
                <label>領収書（ファイル添付）</label>
                <div class="file-drop" id="fileDrop">
                  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="1.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                  <p>ファイルをドラッグ＆ドロップ、またはクリックして選択</p>
                  <p class="file-hint">PDF, JPG, PNG（最大10MB）</p>
                  <input type="file" id="expFile" accept=".pdf,.jpg,.jpeg,.png" />
                </div>
                <div id="filePreview" class="file-preview hidden"></div>
              </div>
            </div>
            <div class="form-actions">
              <button type="button" class="btn-secondary" id="saveDraft">下書き保存</button>
              <button type="submit" class="btn-primary">申請する</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Approval View -->
      <div id="view-approval" class="view">
        <div class="page-header">
          <h1>承認管理</h1>
          <div class="role-switch">
            <span>表示モード：</span>
            <select id="approvalRole">
              <option value="manager">上長（田中 部長）</option>
              <option value="finance">経理担当（鈴木）</option>
            </select>
          </div>
        </div>
        <div class="approval-tabs">
          <button class="tab-btn active" data-tab="pending-approval">承認待ち</button>
          <button class="tab-btn" data-tab="done-approval">処理済み</button>
        </div>
        <div id="pending-approval" class="tab-content active">
          <div id="approvalList"></div>
        </div>
        <div id="done-approval" class="tab-content">
          <div id="doneList"></div>
        </div>
      </div>

      <!-- History View -->
      <div id="view-history" class="view">
        <div class="page-header">
          <h1>申請履歴</h1>
          <div class="filter-bar">
            <select id="filterStatus">
              <option value="all">全ステータス</option>
              <option value="pending">承認待ち</option>
              <option value="manager_approved">上長承認済み</option>
              <option value="approved">承認完了</option>
              <option value="rejected">差し戻し</option>
            </select>
            <select id="filterCategory">
              <option value="all">全カテゴリ</option>
              <option value="交通費">交通費</option>
              <option value="宿泊費">宿泊費</option>
              <option value="会議費">会議費</option>
              <option value="接待費">接待費</option>
              <option value="消耗品費">消耗品費</option>
              <option value="通信費">通信費</option>
              <option value="その他">その他</option>
            </select>
          </div>
        </div>
        <div class="card">
          <table class="expense-table">
            <thead>
              <tr>
                <th>申請日</th>
                <th>使用日</th>
                <th>カテゴリ</th>
                <th>支払先</th>
                <th>金額</th>
                <th>ステータス</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="historyTableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">経費申請詳細</h2>
        <button id="modalClose" class="modal-close">×</button>
      </div>
      <div id="modalContent" class="modal-content"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
